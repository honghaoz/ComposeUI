# This workflow is used to lint the code in the repository.

name: lint
on:
  push:
    branches:
      - main
      - master
      - develop
      - ci
      - cursor/**
  pull_request: # any pull request against any branch
  workflow_dispatch: # manual trigger

concurrency:
  # Newer commits cancel older in-flight CI on the same ref. Scoping the group
  # by event keeps push runs from cancelling scheduled runs (and vice versa).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TERM: xterm-256color
  DEVELOPER_DIR: /Applications/Xcode_${{ vars.XCODE_VERSION }}.app/Contents/Developer

jobs:
  lint:
    name: Lint
    strategy:
      fail-fast: false
    timeout-minutes: 5
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache-ci
        with:
          kind: lint
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: lint
      - name: Lint
        run: make lint
