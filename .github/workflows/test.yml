name: test
on:
  push:
    branches:
      - main
      - master
      - develop
      - ci
      - cursor/** # experiment branches can gather push timing without opening a PR
  pull_request: # any pull request against any branch
  workflow_dispatch: # manual trigger
  schedule:
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of the month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    # │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    # │ │ │ │ │
    # * * * * *
    # Build and format run at 14:30 UTC, so tests use a later window to avoid competing for macOS runners.
    - cron: "17 15 * * *" # every day at 15:17 UTC (7:17 PST, 8:17 PDT)

concurrency:
  # Newer commits cancel older in-flight CI on the same ref. Scoping the group
  # by event keeps push runs from cancelling scheduled runs (and vice versa).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TERM: xterm-256color
  DEVELOPER_DIR: /Applications/Xcode_${{ vars.XCODE_VERSION }}.app/Contents/Developer

jobs:
  test-codecov:
    name: Test (macOS)
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache-ci
        with:
          kind: test-macos
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: test
      - name: Test with Codecov
        run: make test-codecov -C ComposeUI
      - name: Upload code coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ComposeUI/.build/debug/codecov/coverage.lcov
          disable_search: true
          flags: ComposeUI
          name: ComposeUI
          fail_ci_if_error: true

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS] # disable `visionOS` for now as it hangs on GitHub Actions
    timeout-minutes: 30
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache-ci
        with:
          kind: test-${{ matrix.platform }}
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: test
      # - name: Download visionOS simulator
      #   if: matrix.platform == 'visionOS'
      #   run: xcodebuild -downloadPlatform visionOS
      # Phases are separate steps for per-phase timing. The simulator boot is
      # detached, so it overlaps the resolve and build steps; the test step
      # waits for boot readiness.
      - name: Pick simulator
        run: make test-${{ matrix.platform }}-ci PHASE=pick -C ComposeUI
      - name: Boot simulator (async)
        run: make test-${{ matrix.platform }}-ci PHASE=boot -C ComposeUI
      - name: Resolve packages
        run: make test-${{ matrix.platform }}-ci PHASE=resolve -C ComposeUI
      - name: Build for testing
        run: make test-${{ matrix.platform }}-ci PHASE=build -C ComposeUI
      - name: Test
        run: make test-${{ matrix.platform }}-ci PHASE=test -C ComposeUI

  build-visionOS:
    name: Build (visionOS)
    # visionOS tests hang on GitHub Actions, so a Release build is the
    # per-commit visionOS signal. It starts after the fast macOS test job so
    # it never competes with the slower iOS/tvOS jobs for the 5-concurrent
    # macOS runner limit.
    needs: test-codecov
    timeout-minutes: 30
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: build
      - name: Build
        run: make build-release-visionOS -C ComposeUI
