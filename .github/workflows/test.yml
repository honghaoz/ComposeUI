name: test
on:
  push:
    branches:
      - main
      - master
      - develop
      - ci
      - cursor/** # experiment branches can gather push timing without opening a PR
  pull_request: # any pull request against any branch
  workflow_dispatch: # manual trigger
  schedule:
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of the month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    # │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    # │ │ │ │ │
    # * * * * *
    - cron: "30 14 * * *" # every day at 14:30 UTC (6:30 PST, 7:30 PDT)

concurrency:
  # Push-to-master style: newer commits cancel older in-flight CI on the same ref.
  # Warm-cache measurement: a follow-up push should restore DerivedData via restore-keys.
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  TERM: xterm-256color
  DEVELOPER_DIR: /Applications/Xcode_${{ vars.XCODE_VERSION }}.app/Contents/Developer

jobs:
  test-codecov:
    name: Test (macOS)
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache-ci
        with:
          kind: test-macos
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: test
      - name: Test with Codecov
        run: make test-codecov -C ComposeUI
      - name: Upload code coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ComposeUI/.build/debug/codecov/coverage.lcov
          disable_search: true
          flags: ComposeUI
          name: ComposeUI
          fail_ci_if_error: true

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS] # disable `visionOS` for now as it hangs on GitHub Actions
    timeout-minutes: 30
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache-ci
        with:
          kind: test-${{ matrix.platform }}
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: test
      # - name: Download visionOS simulator
      #   if: matrix.platform == 'visionOS'
      #   run: xcodebuild -downloadPlatform visionOS
      - name: Test
        run: make test-${{ matrix.platform }}-ci -C ComposeUI
