# This workflow is used to build the root package and the packages in release configuration on all platforms.

name: build
on:
  release:
    types: [published]
  workflow_dispatch: # manual trigger
    inputs:
      runner:
        description: "The label of the runner to run on. Empty uses the MACOS variable."
        required: false
      xcode-version:
        description: "The Xcode version on the runner, at /Applications/Xcode_<version>.app. Empty uses the XCODE_VERSION variable."
        required: false
      platform:
        description: "The platform to build."
        type: choice
        options: [all, macOS, iOS, tvOS, visionOS]
        default: all
  schedule:
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of the month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    # │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    # │ │ │ │ │
    # * * * * *
    - cron: "30 14 * * *" # every day at 14:30 UTC (6:30 PST, 7:30 PDT)

concurrency:
  # newer commits cancel older in-flight CI on the same ref.
  # scoping the group by event keeps push runs from cancelling scheduled runs (and vice versa).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TERM: xterm-256color
  DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode-version || vars.XCODE_VERSION }}.app/Contents/Developer

jobs:
  build-root:
    name: Build root package
    if: ${{ contains(fromJSON('["all", "macOS"]'), inputs.platform || 'all') }}
    runs-on: ${{ inputs.runner || vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache
        with:
          kind: build-root
          xcode-version: ${{ inputs.xcode-version || vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Build root package
        run: make build

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        # a manual run of one platform builds only that platform
        platform: ${{ fromJSON(contains(fromJSON('["macOS", "iOS", "tvOS", "visionOS"]'), inputs.platform) && format('["{0}"]', inputs.platform) || '["macOS", "iOS", "tvOS", "visionOS"]') }}
    timeout-minutes: 30
    runs-on: ${{ inputs.runner || vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache
        with:
          kind: build-${{ matrix.platform }}
          xcode-version: ${{ inputs.xcode-version || vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Build
        run: make build-release-${{ matrix.platform }} -C ComposeUI
