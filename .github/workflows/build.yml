name: build
on:
  # Direct-push workflow: keep release builds off the hot path.
  # Push CI focuses on lint + test; full Release builds run on schedule / manual.
  workflow_dispatch: # manual trigger
  schedule:
    # ┌───────────── minute (0 - 59)
    # │ ┌───────────── hour (0 - 23)
    # │ │ ┌───────────── day of the month (1 - 31)
    # │ │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    # │ │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    # │ │ │ │ │
    # * * * * *
    - cron: "30 14 * * *" # every day at 14:30 UTC (6:30 PST, 7:30 PDT)

concurrency:
  # Newer commits cancel older in-flight CI on the same ref. Scoping the group
  # by event keeps push runs from cancelling scheduled runs (and vice versa).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TERM: xterm-256color
  DEVELOPER_DIR: /Applications/Xcode_${{ vars.XCODE_VERSION }}.app/Contents/Developer

jobs:
  build-root:
    name: Build root package
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache-ci
        with:
          kind: build-root
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: build
      - name: Build root package
        run: make build

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS, tvOS, visionOS]
    timeout-minutes: 30
    runs-on: ${{ vars.MACOS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache CI artifacts
        uses: ./.github/actions/cache-ci
        with:
          kind: build-${{ matrix.platform }}
          xcode-version: ${{ vars.XCODE_VERSION }}
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          profile: build
      # - name: Download visionOS simulator
      #   if: matrix.platform == 'visionOS'
      #   run: xcodebuild -downloadPlatform visionOS
      - name: Build
        run: make build-release-${{ matrix.platform }} -C ComposeUI
